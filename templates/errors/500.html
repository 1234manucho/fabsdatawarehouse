{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-6rem)] flex items-center py-12">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <p class="text-[10rem] sm:text-[14rem] font-extrabold leading-none grad-text font-mono">500</p>
    <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight -mt-6">Something broke</h1>
    <p class="mt-4 text-slate-400 leading-relaxed max-w-lg mx-auto">
      Our engineers have been alerted. In the meantime, try refreshing — or head back to safety.
    </p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn-primary px-6 py-3 rounded-xl text-sm">Back to home</a>
      <a href="/api/health" class="btn-ghost px-6 py-3 rounded-xl text-sm font-semibold">System status</a>
    </div>
  </div>
</section>
{% endblock %}
