<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2035 773" width="2035" height="773" role="img" aria-label="FABS Trading — Data Warehouse">
  <title>FABS Trading — Data Warehouse</title>

  <!-- ── F mark ─────────────────────────────────────────── -->
  <g>
    <!-- black outer ring, open on the right -->
    <path d="M 545 205 A 248 248 0 1 0 550 548"
          fill="none" stroke="#1a1a1a" stroke-width="74" stroke-linecap="butt"/>
    <!-- red wedge filling the lower-right -->
    <path d="M 330 388 L 545 205 A 248 248 0 0 1 550 548 Z" fill="#ED3138"/>
    <!-- black geometric F -->
    <path d="M 212 205 H 425 L 378 278 H 268 V 352 H 365 L 318 425 H 268 V 560 H 212 Z"
          fill="#1a1a1a"/>
  </g>

  <!-- ── FABS TRADING ───────────────────────────────────── -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
     font-weight="900" font-size="205" letter-spacing="-5">
    <text x="640" y="408" fill="#ED3138">FABS</text>
    <text x="1128" y="408" fill="#1a1a1a">TRADING</text>
  </g>

  <!-- ── DATA WAREHOUSE (replaces "GLOBAL E-COMMERCE") ─── -->
  <text x="643" y="530"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="64" fill="#1a1a1a" letter-spacing="15">
    DATA WAREHOUSE
  </text>
</svg>