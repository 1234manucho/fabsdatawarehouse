<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Fabs Data Warehouse">
  <defs>
    <linearGradient id="ogBgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#050B1A"/>
      <stop offset="60%"  stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#0F1E38"/>
    </linearGradient>
    <linearGradient id="ogTextGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="55%"  stop-color="#00B8A9"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="ogHexGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="55%"  stop-color="#00B8A9"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0.15" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogGlowGold" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBgGrad)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>
  <rect width="1200" height="630" fill="url(#ogGlowGold)"/>

  <!-- Grid overlay -->
  <g opacity="0.14" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="120"  y1="0" x2="120"  y2="630"/>
    <line x1="240"  y1="0" x2="240"  y2="630"/>
    <line x1="360"  y1="0" x2="360"  y2="630"/>
    <line x1="480"  y1="0" x2="480"  y2="630"/>
    <line x1="600"  y1="0" x2="600"  y2="630"/>
    <line x1="720"  y1="0" x2="720"  y2="630"/>
    <line x1="840"  y1="0" x2="840"  y2="630"/>
    <line x1="960"  y1="0" x2="960"  y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Hexagon logo mark -->
  <g transform="translate(100, 80)">
    <path d="M80 0 150 40v80L80 160 10 120V40Z"
          fill="#0A1428"
          stroke="url(#ogHexGrad)"
          stroke-width="6"
          stroke-linejoin="round"/>
    <rect x="52" y="42" width="56" height="14" rx="7" fill="#00E5FF"/>
    <rect x="52" y="68" width="36" height="14" rx="7" fill="#00E5FF" opacity="0.7"/>
    <rect x="52" y="94" width="26" height="14" rx="7" fill="#FFB800"/>
    <circle cx="116" cy="101" r="8" fill="#00E5FF"/>
  </g>

  <!-- Wordmark -->
  <text x="290" y="180"
        font-family="Inter, system-ui, sans-serif"
        font-size="88"
        font-weight="900"
        letter-spacing="-2"
        fill="#FFFFFF">FABS<tspan fill="url(#ogTextGrad)"> DATA</tspan></text>
  <text x="292" y="228"
        font-family="Inter, system-ui, sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="14"
        fill="#00E5FF"
        opacity="0.75">WAREHOUSE</text>

  <!-- Headline -->
  <text x="100" y="380"
        font-family="Inter, system-ui, sans-serif"
        font-size="52"
        font-weight="800"
        letter-spacing="-1"
        fill="#FFFFFF">One warehouse for</text>
  <text x="100" y="448"
        font-family="Inter, system-ui, sans-serif"
        font-size="52"
        font-weight="800"
        letter-spacing="-1"
        fill="url(#ogTextGrad)">payments, security &amp; tracking.</text>

  <!-- Partner badges -->
  <g transform="translate(100, 520)" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="1">
    <rect x="0"   y="0" width="130" height="44" rx="10" fill="rgba(67,176,42,0.12)"  stroke="rgba(67,176,42,0.5)"/>
    <text x="65"  y="28" text-anchor="middle" fill="#43B02A">M-PESA</text>

    <rect x="145" y="0" width="100" height="44" rx="10" fill="rgba(27,79,156,0.18)"  stroke="rgba(27,79,156,0.6)"/>
    <text x="195" y="28" text-anchor="middle" fill="#93C5FD">DPO</text>

    <rect x="260" y="0" width="140" height="44" rx="10" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.5)"/>
    <text x="330" y="28" text-anchor="middle" fill="#FDBA74">PESAPAL</text>

    <rect x="415" y="0" width="140" height="44" rx="10" fill="rgba(0,184,169,0.12)"  stroke="rgba(0,184,169,0.5)"/>
    <text x="485" y="28" text-anchor="middle" fill="#00B8A9">FINSERVE</text>

    <rect x="570" y="0" width="100" height="44" rx="10" fill="rgba(255,184,0,0.12)"  stroke="rgba(255,184,0,0.5)"/>
    <text x="620" y="28" text-anchor="middle" fill="#FFB800">DHL</text>
  </g>

  <!-- Domain -->
  <text x="1100" y="555"
        font-family="JetBrains Mono, monospace"
        font-size="20"
        font-weight="700"
        text-anchor="end"
        fill="#64748B">fabsdata.io</text>
</svg>